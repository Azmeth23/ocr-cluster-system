apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.app.name }}-monitor
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  namespaceSelector:
    matchNames:
      - ocr-app
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval }}