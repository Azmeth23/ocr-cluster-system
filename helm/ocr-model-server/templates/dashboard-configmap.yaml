apiVersion: v1
kind: ConfigMap
metadata:
  name: ocr-model-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  ocr-dashboard.json: |
{
  {
  "title": "OCR Model Monitor",
  "schemaVersion": 38,
  "version": 3,
  "refresh": "10s",
  "panels": [
    {
      "id": 1,
      "title": "Inference Requests (Last 5m)",
      "type": "stat",
      "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
      "targets": [
        {
          "expr": "sum(increase(request_predict_seconds_count[5m]))",
          "refId": "A"
        }
      ]
    },
    {
      "id": 6,
      "title": "Average Inference Latency",
      "type": "stat",
      "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
      "targets": [
        {
          "expr": "rate(request_predict_seconds_sum[5m]) / rate(request_predict_seconds_count[5m])",
          "refId": "A"
        }
      ],
      "fieldConfig": {
        "defaults": {
          "unit": "s"
        }
      }
    },
    {
      "id": 7,
      "title": "Model Status",
      "type": "stat",
      "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
      "targets": [
        {
          "expr": "up{job=\"ocr-model-service\"}",
          "refId": "A"
        }
      ]
    },
    {
      "id": 8,
      "title": "Request Status / Error Rate Note",
      "type": "text",
      "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
      "options": {
        "mode": "markdown",
        "content": "The provided KServe model exposes request count, latency and resource metrics only. HTTP status/error metrics are not available from the built-in /metrics endpoint."
      }
    },
    {
      "id": 2,
      "title": "Inference Throughput (Req/sec)",
      "type": "timeseries",
      "gridPos": { "h": 8, "w": 6, "x": 0, "y": 4 },
      "targets": [
        {
          "expr": "sum(rate(request_predict_seconds_count[5m]))",
          "refId": "A"
        }
      ]
    },
    {
      "id": 3,
      "title": "95th Percentile Latency",
      "type": "timeseries",
      "gridPos": { "h": 8, "w": 6, "x": 6, "y": 4 },
      "targets": [
        {
          "expr": "histogram_quantile(0.95, sum(rate(request_predict_seconds_bucket[5m])) by (le))",
          "refId": "A"
        }
      ]
    },
    {
      "id": 4,
      "title": "CPU Usage (sec/sec)",
      "type": "timeseries",
      "gridPos": { "h": 8, "w": 6, "x": 12, "y": 4 },
      "targets": [
        {
          "expr": "rate(process_cpu_seconds_total[5m])",
          "refId": "A"
        }
      ]
    },
    {
      "id": 5,
      "title": "Memory Usage (MB)",
      "type": "timeseries",
      "gridPos": { "h": 8, "w": 6, "x": 18, "y": 4 },
      "targets": [
        {
          "expr": "process_resident_memory_bytes / 1024 / 1024",
          "refId": "A"
        }
      ]
    }
  ]
}
}