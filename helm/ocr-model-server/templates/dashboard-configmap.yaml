apiVersion: v1
kind: ConfigMap
metadata:
  name: ocr-model-dashboard
  labels:
    grafana_dashboard: "1"
data:
  ocr-dashboard.json: |
    {
      "title": "OCR Model Monitor",
      "schemaVersion": 38,
      "version": 4,
      "refresh": "10s",
      "panels": [
        {
          "id": 8,
          "title": "Dashboard Note",
          "type": "text",
          "gridPos": { "h": 2, "w": 24, "x": 0, "y": 0 },
          "options": {
            "mode": "markdown",
            "content": "**Note:** The KServe model exposes request count, latency, and resource metrics. HTTP status/error codes are not available on the native metrics endpoint."
          }
        },
        {
          "id": 1,
          "title": "Inference Requests (Last 5m)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 2 },
          "targets": [
            {
              "expr": "sum(increase(request_predict_seconds_count[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Average Inference Latency",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 2 },
          "targets": [
            {
              "expr": "rate(request_predict_seconds_sum[5m]) / rate(request_predict_seconds_count[5m])",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "id": 7,
          "title": "Model Status",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 2 },
          "targets": [
            {
              "expr": "up{job=\"ocr-model-service\"}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Inference Throughput (Req/sec)",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 6 },
          "targets": [
            {
              "expr": "sum(rate(request_predict_seconds_count[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "95th Percentile Latency",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 6 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(request_predict_seconds_bucket[5m])) by (le))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "id": 4,
          "title": "CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 15 },
          "targets": [
            {
              "expr": "rate(process_cpu_seconds_total[5m])",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 5,
          "title": "Memory Usage",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 15 },
          "targets": [
            {
              "expr": "process_resident_memory_bytes",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        }
      ]
    }